<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Game About Crates — Save Tool</title>
  <link rel="icon" href="https://em-content.zobj.net/source/microsoft-3D-fluent/433/package_1f4e6.png" />
  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.19/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.19/theme/material-darker.min.css" />
  <!-- Google Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #181411;
      --surface:  #1d1915;
      --surface2: #232018;
      --border:   #2d2821;
      --border2:  #3c342b;
      --text:     #ede8e2;
      --text2:    #8c7f72;
      --text3:    #564e46;
      --primary:  #c66d00;
      --primary-h:#d87e10;
      --accent:   #dda51c;
      --err:      #d95858;
      --ok:       #5aaa5a;
      --warn:     #dda51c;
      --r:        6px;
      --r2:       10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      font-size: 14px;
      line-height: 1.55;
      min-height: 100vh;
      padding: 0 0 72px;
    }

    .wrap      { max-width: 660px;  margin: 0 auto; padding: 0 16px; }
    .wide-wrap { max-width: 1600px; margin: 0 auto; padding: 0 20px; }

    /* ── Hero ── */
    .hero { position: relative; width: 100%; height: 300px; overflow: hidden; }
    .hero-img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover;
      filter: blur(6px) brightness(.55) saturate(.9);
      transform: scale(1.06);
    }
    .hero-fade {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom,
        rgba(24,20,17,0) 0%, rgba(24,20,17,.55) 55%, rgba(24,20,17,1) 100%);
    }
    .hero-content {
      position: absolute; bottom: 28px; left: 0; right: 0;
      padding: 0 20px; max-width: 660px; margin: 0 auto;
    }
    .hd-top { display: flex; align-items: center; gap: 12px; }
    .hd-top h1 { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
    .chip {
      font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      background: rgba(198,109,0,.18); border: 1px solid rgba(198,109,0,.45);
      color: var(--accent); border-radius: 4px; padding: 2px 7px;
    }
    .hd-meta { margin-top: 4px; font-size: 12px; color: var(--text3); }
    .hd-meta a { color: var(--text3); text-decoration: none; border-bottom: 1px solid var(--border2); }
    .hd-meta a:hover { color: var(--text2); }

    /* ── Sub-header ── */
    .hd { padding: 18px 0 20px; }
    .hd-sub { color: var(--text2); font-size: 13px; }

    /* ── Editor three-column layout ── */
    .editor-section { margin-bottom: 32px; }
    .editor-layout {
      display: grid;
      grid-template-columns: 1fr 190px 1fr;
      gap: 14px;
      align-items: start;
    }

    /* ── Pane ── */
    .pane {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 500px;
    }
    .pane-hd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      gap: 8px; flex-shrink: 0;
    }
    .pane-title { display: flex; align-items: baseline; gap: 8px; }
    .pane-lbl {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .8px; color: var(--text3);
    }
    .pane-hint { font-size: 11.5px; color: var(--text3); }
    .pane-acts { display: flex; gap: 5px; flex-shrink: 0; }

    /* ── Status strip (above editor area) ── */
    .pane-stat {
      font-size: 12.5px; line-height: 1.4;
      max-height: 0; overflow: hidden; padding: 0 14px;
      flex-shrink: 0;
      transition: max-height .18s ease, padding .18s ease;
    }
    .pane-stat.err  { max-height: 80px; padding: 8px 14px; background: rgba(217,88,88,.1);  border-bottom: 1px solid rgba(217,88,88,.28);  color: var(--err); }
    .pane-stat.warn { max-height: 80px; padding: 8px 14px; background: rgba(221,165,28,.1); border-bottom: 1px solid rgba(221,165,28,.28); color: var(--warn); }
    .pane-stat.ok   { max-height: 80px; padding: 8px 14px; background: rgba(90,170,90,.1);  border-bottom: 1px solid rgba(90,170,90,.28);  color: var(--ok); }

    /* ── ENC1 raw textarea ── */
    .pane-ta {
      flex: 1; width: 100%;
      background: var(--surface); color: var(--text);
      border: none; resize: none; outline: none;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 12.5px; line-height: 1.6;
      padding: 12px 14px;
      min-height: 420px;
    }
    .pane-ta::placeholder { color: var(--text3); }
    .pane-ta.dragover { outline: 2px solid var(--primary); outline-offset: -2px; }

    /* ── CodeMirror overrides ── */
    #json-editor { flex: 1; min-height: 0; }
    #json-editor .CodeMirror {
      height: 100%; min-height: 420px;
      background: var(--surface); color: var(--text);
      border: none; border-radius: 0;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 12.5px; line-height: 1.6;
    }
    #json-editor .CodeMirror-scroll { min-height: 420px; }
    #json-editor .CodeMirror-gutters {
      background: var(--surface2); border-right: 1px solid var(--border);
    }
    #json-editor .CodeMirror-linenumber { color: var(--text3); padding: 0 8px 0 4px; }
    #json-editor .CodeMirror-cursor { border-left: 2px solid var(--accent); }
    #json-editor .CodeMirror-selected { background: rgba(198,109,0,.18) !important; }
    #json-editor .CodeMirror-activeline-background { background: rgba(255,255,255,.025); }
    /* JSON token colours matching the page palette */
    #json-editor .cm-s-material-darker.CodeMirror      { background: var(--surface); color: var(--text); }
    #json-editor .cm-s-material-darker .cm-property    { color: var(--text); }
    #json-editor .cm-s-material-darker .cm-string      { color: #dda51c; }
    #json-editor .cm-s-material-darker .cm-number      { color: #e09060; }
    #json-editor .cm-s-material-darker .cm-atom        { color: #5aaa5a; }
    #json-editor .cm-s-material-darker .cm-punctuation,
    #json-editor .cm-s-material-darker .cm-bracket     { color: var(--text2); }

    /* ── Center column ── */
    .pane-center { display: flex; flex-direction: column; }
    .center-inner {
      display: flex; flex-direction: column; gap: 16px;
      position: sticky; top: 20px;
    }
    .arrows { display: flex; flex-direction: column; gap: 8px; }

    /* ── Buttons ── */
    .btn {
      background: var(--primary); border: none; border-radius: var(--r);
      color: #fff; font-size: 13.5px; font-weight: 600;
      padding: 10px 14px; cursor: pointer;
      transition: background .13s, transform .08s;
      display: flex; align-items: center; justify-content: center;
      gap: 7px; width: 100%;
    }
    .btn:hover { background: var(--primary-h); }
    .btn:active { transform: scale(.98); }
    .arr-icon { font-size: 20px; line-height: 1; }

    /* ── Material Symbols ── */
    .material-symbols-outlined {
      font-size: inherit; line-height: 1;
      vertical-align: middle; user-select: none;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
    .btn-ghost .material-symbols-outlined { font-size: 15px; }
    .adv-arrow.material-symbols-outlined  { font-size: 16px; transition: transform .2s; }

    .btn-ghost {
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: var(--r); color: var(--text2);
      font-size: 12px; padding: 6px 10px; cursor: pointer;
      white-space: nowrap; line-height: 1;
      position: relative; overflow: hidden;
      transition: background .12s, color .12s, border-color .12s;
    }
    .btn-ghost:hover { background: var(--border2); color: var(--text); }
    .btn-ghost.done  { color: var(--ok); border-color: rgba(90,170,90,.4); }

    .btn-face {
      display: flex; align-items: center; gap: 4px;
      transition: transform .22s cubic-bezier(.4,0,.2,1), opacity .22s;
    }
    .btn-face.done {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      transform: translateY(110%); opacity: 0;
    }
    .btn-ghost.done .btn-face.default { transform: translateY(-110%); opacity: 0; }
    .btn-ghost.done .btn-face.done    { transform: translateY(0);     opacity: 1; }

    /* ── Field / input ── */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .lbl { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .7px; }

    input[type=text] {
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: var(--r); color: var(--text);
      font-size: 13px; padding: 8px 10px; outline: none; width: 100%;
      transition: border-color .14s;
    }
    input[type=text]:focus { border-color: var(--primary); }
    input[type=text]::placeholder { color: var(--text3); }

    /* ── Advanced ── */
    .adv-btn {
      background: none; border: none; color: var(--text2); font-size: 12px;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      padding: 0; transition: color .12s; width: 100%;
    }
    .adv-btn:hover { color: var(--text); }
    .adv-arrow { font-size: 9px; transition: transform .2s; display: inline-flex; align-items: center; }
    .adv-btn.open .adv-arrow { transform: rotate(90deg); }
    .adv-body { display: none; padding-top: 10px; }
    .adv-body.open { display: block; }

    /* ── Footer ── */
    footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--text3); }
    footer a { color: var(--text3); border-bottom: 1px solid var(--border2); text-decoration: none; }
    footer a:hover { color: var(--text2); }

    /* ── Responsive ── */
    @media (max-width: 820px) {
      .editor-layout { grid-template-columns: 1fr; }
      .pane-center { padding: 0; }
      .center-inner { position: static; }
      .arrows { flex-direction: row; }
      .arrows .btn { flex: 1; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <header class="hd">

<div class="editor-section">
  <div class="wide-wrap">
    <div class="editor-layout">

      <!-- ══ LEFT: ENC1 ══ -->
      <div class="pane">
        <div class="pane-hd">
          <div class="pane-title">
            <span class="pane-lbl">ENC1</span>

          </div>

            <button class="btn-ghost" id="enc1-load" title="Load file" onclick="loadFileTa('enc1-ta','enc1-load')">
              <div class="btn-face default"><span class="material-symbols-outlined">folder_open</span></div>

            <button class="btn-ghost" id="enc1-copy" onclick="copyTa('enc1-ta','enc1-copy')">

            <button class="btn-ghost" id="enc1-paste" onclick="pasteTa('enc1-ta','enc1-paste')">

            <div class="adv-body" id="adv-body">

                <label class="lbl" for="enc-key">Encryption key</label>

            </div>
          </div>

        </div>
      </div>

      <!-- ══ RIGHT: JSON ══ -->
      <div class="pane">

            <span class="pane-lbl">JSON</span>
            <span class="pane-hint">decoded data</span>
          </div>
          <div class="pane-acts">
            <button class="btn-ghost" id="json-load" title="Load file" onclick="loadFileJson('json-load')">
              <div class="btn-face default"><span class="material-symbols-outlined">folder_open</span></div>
              <div class="btn-face done"><span class="material-symbols-outlined">check</span></div>

            <button class="btn-ghost" id="json-copy" onclick="copyJson('json-copy')">
              <div class="btn-face default"><span class="material-symbols-outlined">content_copy</span> Copy</div>
              <div class="btn-face done"><span class="material-symbols-outlined">check</span> Copied</div>
            </button>
            <button class="btn-ghost" id="json-paste" onclick="pasteJson('json-paste')">
              <div class="btn-face default"><span class="material-symbols-outlined">content_paste</span> Paste</div>
              <div class="btn-face done"><span class="material-symbols-outlined">check</span> Pasted</div>
            </button>
            <button class="btn-ghost" id="json-dl" onclick="dlJson('json-dl')">
              <div class="btn-face default"><span class="material-symbols-outlined">download</span> Save</div>
              <div class="btn-face done"><span class="material-symbols-outlined">check</span> Saved</div>
            </button>
          </div>
        </div>
        <div class="pane-stat" id="stat-json"></div>
        <div id="json-editor"></div>
      </div>

    </div><!-- /editor-layout -->
  </div><!-- /wide-wrap -->
</div><!-- /editor-section -->

    by <a href="https://vrchat.com/home/user/usr_1f6a7514-3435-479d-b956-2efb6f1c2274" target="_blank" rel="noopener">_Froggi</a>.

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.19/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.19/mode/javascript/javascript.min.js"></script>
<script src="crypto.js"></script>
<script>
/* ── CodeMirror init ── */
const jsonEditor = CodeMirror(document.getElementById('json-editor'), {
  mode: { name: 'javascript', json: true },
  theme: 'material-darker',
  lineNumbers: true,
  tabSize: 2,
  indentWithTabs: false,
  lineWrapping: true,
  autofocus: false,
});

/* ── Status helpers ── */
function setStat(id, type, msg) {
  const el = document.getElementById('stat-' + id);
  el.className = 'pane-stat ' + (type || '');
  el.textContent = msg || '';
}

/* ── Feedback flash ── */
function flashBtn(btnId, ms) {
  const btn = typeof btnId === 'string' ? document.getElementById(btnId) : btnId;
  if (!btn) return;
  btn.classList.add('done');
  setTimeout(() => btn.classList.remove('done'), ms || 1600);
}

/* ── Copy / Paste ── */
function copyTa(taId, btnId) {
  navigator.clipboard.writeText(document.getElementById(taId).value).then(() => flashBtn(btnId));
}

function pasteTa(taId, btnId) {
  navigator.clipboard.readText().then(text => {
    document.getElementById(taId).value = text;
    flashBtn(btnId);
  });
}

function copyJson(btnId) {
  navigator.clipboard.writeText(jsonEditor.getValue()).then(() => flashBtn(btnId));
}

function pasteJson(btnId) {
  navigator.clipboard.readText().then(text => {
    jsonEditor.setValue(text);
    flashBtn(btnId);
  });
}

/* ── Download ── */
function dlTa(taId, name, btnId) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([document.getElementById(taId).value], { type: 'text/plain' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  flashBtn(btnId);
}

function dlJson(btnId) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([jsonEditor.getValue()], { type: 'application/json' }));
  a.download = 'save_decoded.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  flashBtn(btnId);
}

/* ── File loaders ── */
function loadFileTa(taId, btnId) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = ev => { document.getElementById(taId).value = ev.target.result; flashBtn(btnId); };
    fr.readAsText(f, 'utf-8');
  };
  inp.click();
}

function loadFileJson(btnId) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,.txt';
  inp.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = ev => { jsonEditor.setValue(ev.target.result); flashBtn(btnId); };
    fr.readAsText(f, 'utf-8');
  };
  inp.click();
}

/* ── Advanced ── */
function toggleAdv() {
  document.getElementById('adv-tog').classList.toggle('open');
  document.getElementById('adv-body').classList.toggle('open');
}

/* ── Drag-and-drop on ENC1 textarea ── */
const enc1Ta = document.getElementById('enc1-ta');
enc1Ta.addEventListener('dragover',  e => { e.preventDefault(); enc1Ta.classList.add('dragover'); });
enc1Ta.addEventListener('dragleave', () => enc1Ta.classList.remove('dragover'));
enc1Ta.addEventListener('drop', e => {
  e.preventDefault(); enc1Ta.classList.remove('dragover');
  const f = e.dataTransfer.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = ev => { enc1Ta.value = ev.target.result; };
  fr.readAsText(f, 'utf-8');
});

/* ── Actions ── */
function runDecrypt() {
  const enc1   = document.getElementById('enc1-ta').value.trim();
  const player = document.getElementById('player-name').value.trim();
  const key    = document.getElementById('enc-key').value.trim();
  if (!enc1)   return setStat('enc1', 'err', 'Paste the ENC1 save content first.');
  if (!player) return setStat('enc1', 'err', 'Enter the player name.');
  try {
    const { json, keys, warning } = decrypt(enc1, player, key);
    setStat('enc1', warning ? 'warn' : 'ok', warning || 'Decrypted \u2014 ' + keys + ' keys');
    setStat('json', 'ok', keys + ' keys');
    jsonEditor.setValue(json);
  } catch (e) {
    setStat('enc1', 'err', e.message);
  }
}

function runEncrypt() {
  const player  = document.getElementById('player-name').value.trim();
  const key     = document.getElementById('enc-key').value.trim();
  const jsonTxt = jsonEditor.getValue().trim();
  if (!jsonTxt) return setStat('json', 'err', 'Enter the JSON data first.');
  if (!player)  return setStat('json', 'err', 'Enter the player name.');
  try {
    const result = encrypt(jsonTxt, player, key);
    const bytes  = (result.length - 9) >>> 1;
    setStat('json', 'ok', 'Encrypted \u2014 ' + bytes + ' bytes');
    setStat('enc1', 'ok', result.length + ' chars');
    document.getElementById('enc1-ta').value = result;
  } catch (e) {
    setStat('json', 'err', e.message);
  }
}

/* Enter on player name triggers decrypt */
document.getElementById('player-name').addEventListener('keydown', e => {
